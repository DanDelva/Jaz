<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuerdo Especial</title>
    <style>
        /* Importamos una fuente elegante tipo película */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #000; /* Fondo negro profundo */
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Evita barras de desplazamiento */
            font-family: 'Montserrat', sans-serif;
        }

        .contenedor-texto {
            position: relative;
            width: 80%;
            max-width: 800px;
            text-align: center;
        }

        .linea-texto {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: 100%;
            font-size: 2.2rem;
            line-height: 1.5;
            letter-spacing: 2px;
            font-family: 'Cinzel', serif;
            color: #fceea7; /* Un tono ligeramente dorado/amarillo sutil simulando un girasol */
            
            /* Estado inicial: invisible y desenfocado */
            opacity: 0;
            filter: blur(12px);
            
            /* Transición suave para el suspenso */
            transition: opacity 2.5s ease-in-out, filter 2.5s ease-in-out, transform 4s ease-out;
            pointer-events: none;
        }

        /* Clase que se añade con JS para mostrar el texto */
        .linea-texto.visible {
            opacity: 1;
            filter: blur(0px);
            transform: translate(-50%, -50%) scale(1.05); /* Ligero zoom continuo */
        }

        /* Clase para desvanecer el texto hacia adelante */
        .linea-texto.oculto {
            opacity: 0;
            filter: blur(10px);
            transform: translate(-50%, -50%) scale(1.15);
        }

        /* Contenedor principal que aparecerá después de la intro */
        #contenido-principal {
            opacity: 0;
            transition: opacity 3s ease-in;
            display: none; /* Oculto inicialmente */
            text-align: center;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
        }

        #titulo-recuerdo {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: #fceea7;
            text-shadow: 0 0 10px rgba(252, 238, 167, 0.4);
            margin-bottom: 30px;
        }

        .video-container {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(252, 238, 167, 0.15);
            border: 1px solid rgba(252, 238, 167, 0.2);
            background-color: #0c0c0c;
        }

        #video-recuerdo {
            width: 100%;
            max-height: 65vh; /* Evita que ocupe demasiado verticalmente */
            display: block;
        }
    </style>
</head>
<body>

    <!-- Animación de Introducción -->
    <div class="contenedor-texto" id="intro-container">
        <div id="texto1" class="linea-texto">Mientras te diviertes</div>
        <div id="texto2" class="linea-texto">Deje una puerta abierta</div>
        <div id="texto3" class="linea-texto">Por si vienes...</div>
    </div>

    <!-- Aquí irá tu contenido real (fotos, girasoles, etc.) -->
    <div id="contenido-principal">
        <h1 id="titulo-recuerdo"></h1>
        <div class="video-container">
            <video id="video-recuerdo" src="video/wzpjaz.mp4" autoplay controls playsinline></video>
        </div>
    </div>

    <script>
        // Tiempos de la animación (en milisegundos)
        const tiempoLectura = 5500; // Cuánto tiempo se queda en pantalla (incrementado a 5.5s)
        const tiempoTransicion = 2500; // Tiempo que tarda en desaparecer antes de la siguiente

        const texto1 = document.getElementById('texto1');
        const texto2 = document.getElementById('texto2');
        const texto3 = document.getElementById('texto3');
        const introContainer = document.getElementById('intro-container');
        const contenidoPrincipal = document.getElementById('contenido-principal');

        // Lógica inteligente de interacción para saltarse el bloqueo de autoplay de los navegadores.
        // Si el usuario hace click/toca en cualquier parte de la pantalla, se registra el permiso.
        let interactuado = false;
        
        const intentarDesmutarYJugar = () => {
            const video = document.getElementById('video-recuerdo');
            if (video) {
                video.volume = 1.0; // Iniciar con todo el volumen
                video.muted = false; // Desmutear
                video.play().then(() => {
                    // Si se pudo reproducir con sonido, quitamos los listeners de interacción
                    document.removeEventListener('click', registrarInteraccion);
                    document.removeEventListener('touchstart', registrarInteraccion);
                }).catch(e => {
                    console.log("No se pudo reproducir con sonido aún:", e);
                });
            }
        };

        const registrarInteraccion = () => {
            interactuado = true;
            if (contenidoPrincipal.style.display === 'block') {
                intentarDesmutarYJugar();
            }
        };
        document.addEventListener('click', registrarInteraccion);
        document.addEventListener('touchstart', registrarInteraccion);

        // Secuencia de animación
        setTimeout(() => {
            // 1. Entra la primera frase
            texto1.classList.add('visible');
            
            setTimeout(() => {
                // Sale la primera, entra la segunda
                texto1.classList.remove('visible');
                texto1.classList.add('oculto');
                
                setTimeout(() => {
                    texto2.classList.add('visible');
                    
                    setTimeout(() => {
                        // Sale la segunda, entra la tercera
                        texto2.classList.remove('visible');
                        texto2.classList.add('oculto');
                        
                        setTimeout(() => {
                            texto3.classList.add('visible');
                            
                            // Después de que la última frase se lee, desaparece y muestra el contenido
                            setTimeout(() => {
                                texto3.classList.remove('visible');
                                texto3.classList.add('oculto');
                                
                                setTimeout(() => {
                                    // Ocultamos el contenedor de texto y mostramos la página principal
                                    introContainer.style.display = 'none';
                                    contenidoPrincipal.style.display = 'block';
                                    document.body.style.overflow = 'auto'; // Permitir scroll si el contenido/video es más grande que la pantalla
                                    
                                    // Pequeño retraso para que aplique el fade-in al contenido principal
                                    setTimeout(() => {
                                        contenidoPrincipal.style.opacity = '1';
                                        
                                        // Intentar reproducir el video automáticamente al mostrar el contenido
                                        const video = document.getElementById('video-recuerdo');
                                        if (video) {
                                            video.volume = 1.0; // Iniciar con todo el volumen
                                            video.muted = false; // Intentar iniciar desmutado
                                            video.play().then(() => {
                                                // Si se reproduce con sonido con éxito, quitar listeners
                                                document.removeEventListener('click', registrarInteraccion);
                                                document.removeEventListener('touchstart', registrarInteraccion);
                                            }).catch(error => {
                                                console.log("El navegador bloqueó la reproducción con sonido. Forzando autoplay en silencio...");
                                                video.muted = true;
                                                video.play().catch(err => {
                                                    console.error("No se pudo iniciar el vídeo ni siquiera en silencio:", err);
                                                });
                                            });
                                        }
                                    }, 100);
                                    
                                }, tiempoTransicion);
                            }, tiempoLectura + 1000); // Le damos un poco más de tiempo a la última frase

                        }, tiempoTransicion);
                    }, tiempoLectura - 1000); // La segunda frase es corta, menos tiempo

                }, tiempoTransicion);
            }, tiempoLectura);

        }, 1000); // 1 segundo de pantalla negra inicial antes de empezar
    </script>
</body>
</html>
